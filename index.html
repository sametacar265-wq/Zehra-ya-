<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zehra'ya 💌</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fff0f5;
      overflow: hidden;
      font-family: "Comic Sans MS", cursive;
      text-align: center;
      color: #ff4d94;
    }

    h1 {
      margin-top: 40px;
      font-size: 3em;
      text-shadow: 2px 2px 5px #ffb6c1;
    }

    .gallery {
      margin-top: 20px;
    }

    .gallery img {
      width: 40%;
      margin: 10px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(255, 182, 193, 0.8);
    }

    .heart {
      position: fixed;
      top: -10px;
      color: pink;
      font-size: 24px;
      animation: fall linear infinite;
      opacity: 0.9;
      z-index: 1;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    .quote {
      font-size: 1.6em;
      color: #ff66a3;
      margin-top: 40px;
      font-style: italic;
      text-shadow: 1px 1px 4px #ffd6e7;
    }

    .footer {
      position: fixed;
      bottom: 20px;
      right: 30px;
      font-size: 1.2em;
      color: #ff3385;
      font-weight: bold;
      text-shadow: 1px 1px 3px #ffd6e7;
    }
  </style>
</head>
<body>
  <h1>Zehra'ya 💖</h1>

  <div class="gallery">
    <img src="https://raw.githubusercontent.com/sametacar265-wq/Zehra-ya-/refs/heads/main/Görseller/53c45bd8-df60-4c16-892e-aa2e1346938d.jpeg" alt="Fotoğraf 1">
    <img src="https://raw.githubusercontent.com/sametacar265-wq/Zehra-ya-/refs/heads/main/Görseller/5f3676d2-7352-48a0-bb99-c93c635e2c8a.jpeg" alt="Fotoğraf 2">
    <img src="https://raw.githubusercontent.com/sametacar265-wq/Zehra-ya-/refs/heads/main/Görseller/911cbe1b-cf01-4233-8e28-900d02f12850.jpeg" alt="Fotoğraf 3">
    <img src="https://raw.githubusercontent.com/sametacar265-wq/Zehra-ya-/refs/heads/main/Görseller/16cca18f-8a94-427f-960f-ce1d1038c943.jpeg" alt="Fotoğraf 4">
  </div>

  <div class="quote">💫 Gülüşü güzel kadınlar papatyaları severmiş 🌼</div>

  <div class="footer">💌 Ömer'den Zehra'ya 💌</div>

  <!-- 💕 Gizli müzik -->
  <audio autoplay loop>
    <source src="https://cdn.pixabay.com/audio/2024/02/12/audio_128486.mp3" type="audio/mpeg">
  </audio>

  <script>
    const colors = ['#ff69b4', '#ff1493', '#ffd700', '#0000cd', '#ffb6c1'];
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '💖';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = Math.random() * 20 + 20 + 'px';
      heart.style.color = colors[Math.floor(Math.random() * colors.length)];
      heart.style.animationDuration = Math.random() * 3 + 2 + 's';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }
    setInterval(createHeart, 300);
  </script>
</body>
</html>
